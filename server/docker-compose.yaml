name: mem0-dev
services:
  mem0:
    build:
      context: ..
      dockerfile: server/dev.Dockerfile
    ports:
    - 8888:8000
    env_file:
    - .env
    networks:
    - mem0_network
    volumes:
    - ./history:/app/history
    - ./main.py:/app/main.py:ro
    - ./server_state.py:/app/server_state.py:ro
    - ./requirements.txt:/app/requirements.txt:ro
    - ../mem0:/app/mem0:ro
    - ../pyproject.toml:/app/pyproject.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
    - PYTHONDONTWRITEBYTECODE=1
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=
    - DASHBOARD_URL=http://10.200.1.163:3002
    - APP_DB_NAME=mem0_app
    - JWT_SECRET=${JWT_SECRET}
    - AUTH_DISABLED=${AUTH_DISABLED:-false}
    - MEM0_TELEMETRY=${MEM0_TELEMETRY:-true}
  postgres:
    image: pgvector/pgvector:pg17
    restart: on-failure
    shm_size: 128mb
    networks:
    - mem0_network
    environment:
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -q -d postgres -U ${POSTGRES_USER:-postgres}
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
    - ./data/postgres:/var/lib/postgresql/data
    - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
    - 8432:5432
  mem0-dashboard:
    build: ./dashboard
    ports:
    - 3002:3000
    networks:
    - mem0_network
    environment:
    - NEXT_PUBLIC_API_URL=http://10.200.1.163:8888
    - API_INTERNAL_URL=http://mem0:8000
    - NEXT_PUBLIC_INSTANCE_NAME=Mem0
    - NODE_ENV=development
    depends_on:
      mem0:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 3
  falkordb:
    image: falkordb/falkordb:latest
    ports:
    - 6379:6379
    - 3003:3000
    volumes:
    - ./data/falkordb:/data
    networks:
    - mem0_network
    command:
    - redis-server
    - --dir
    - /data
    - --save
    - '60'
    - '1'
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  mem0_network:
    driver: bridge
